# cargo-deny configuration. See docs/architecture/adr/0003-dependency-enforcement.md.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# RustSec advisory DB (network). Defaults deny vulnerabilities and unmaintained crates per installed version.
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# epaint_default_fonts (egui default_fonts): embedded font data; user-approved Phase 8, see ADR-0018.
# Scoped to this crate only so the font licenses are not allowed workspace-wide.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Workspace crates are publish = false; their license (MIT OR Apache-2.0) is still declared.
ignore = true

[bans]
multiple-versions = "warn"   # wgpu/winit stacks duplicate; kept at warn per ADR-0005
wildcards = "deny"
allow-wildcard-paths = true  # workspace path deps of publish = false crates
deny = [
    { crate = "wgpu", wrappers = ["engine-render-wgpu", "egui-wgpu"], reason = "GPU API confined to the backend crate (WS-03, ADR-0002)" },
    { crate = "winit", wrappers = ["engine-platform"], reason = "Windowing confined to the platform crate (WS-03, ADR-0002)" },
    { crate = "gltf", wrappers = ["conventional-3d"], reason = "glTF importer confined to the conventional-3d extension (REND-05, ADR-0007)" },
    { crate = "image", wrappers = ["conventional-3d", "gltf"], reason = "Image decoding confined to extensions (REND-05, ADR-0007)" },
    { crate = "egui", wrappers = ["debug-ui", "engine-render-wgpu", "engine-sdk"], reason = "egui confined to the debug overlay path: debug-ui, the wgpu backend and the optional SDK feature (ADR-0018)" },
    { crate = "egui-wgpu", wrappers = ["engine-render-wgpu"], reason = "egui painter confined to the backend crate (ADR-0018)" },
    { crate = "hecs", wrappers = ["ecs-bench"], reason = "ECS candidate confined to the ecs-bench spike (ADR-0017)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
