[package]
name = "planetary-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Planetary reference app (orbit-to-surface flight) on the public SDK. Nothing in the engine depends on it."

[dependencies]
engine-sdk.workspace = true
planetary-core = { path = "../planetary-core" }
planetary-terrain = { path = "../planetary-terrain" }

[features]
# Read-only debug overlay (off by default), toggled with F3. The app only builds the snapshot;
# the SDK feature `egui-overlay` owns debug-ui and the painter, so this crate stays SDK-only
# (APP-02 guard, tests/sdk_only.rs) and names neither egui nor debug-ui.
debug-overlay = ["engine-sdk/egui-overlay"]

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
# Image-scene test only (tests/atmosphere_ring.rs): the ring builder is planetary-app code, so
# the test lives here (crates/ must never depend on extensions/, rule R1). Not [dependencies]:
# the APP-02 guard (tests/sdk_only.rs) keeps the shipped crate SDK-only.
engine-render = { workspace = true }
engine-render-wgpu = { workspace = true }
png = { workspace = true }

[[bench]]
name = "stream"
harness = false
