[package]
name = "planetary-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Planetary reference app (orbit-to-surface flight) on the public SDK. Nothing in the engine depends on it."

[dependencies]
engine-sdk.workspace = true
engine-diagnostics.workspace = true
debug-ui = { path = "../../../crates/debug-ui", optional = true }
planetary-core = { path = "../planetary-core" }
planetary-terrain = { path = "../planetary-terrain" }

[features]
# Debug overlay data and UI crate; off by default (plan 08 wires the painter and F3).
debug-overlay = ["dep:debug-ui"]

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "stream"
harness = false
