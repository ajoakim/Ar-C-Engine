[package]
name = "planetary-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Planetary reference app (orbit-to-surface flight) on the public SDK. Nothing in the engine depends on it."

[dependencies]
engine-sdk.workspace = true
planetary-core = { path = "../planetary-core" }
planetary-terrain = { path = "../planetary-terrain" }

[features]
# Debug overlay snapshot builder (off by default). The debug-ui painter and F3 wiring land in plan 08;
# the APP-02 guard (tests/sdk_only.rs) keeps this crate SDK-only until then.
debug-overlay = []

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "stream"
harness = false
