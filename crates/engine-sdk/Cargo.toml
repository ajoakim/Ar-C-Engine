[package]
name = "engine-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Public SDK facade for applications and extensions."

[dependencies]
engine-math.workspace = true
engine-diagnostics.workspace = true
engine-core.workspace = true
engine-jobs.workspace = true
engine-procedural.workspace = true
engine-platform.workspace = true
engine-assets.workspace = true
engine-world.workspace = true
engine-spatial.workspace = true
engine-streaming.workspace = true
engine-render.workspace = true
engine-render-wgpu.workspace = true
thiserror.workspace = true
tracing.workspace = true
debug-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }

[features]
# Read-only debug overlay hand-off (ADR-0018, plan 08-08). Off by default: no egui in default
# builds. Apps return a `DiagnosticsSnapshot` from `App::overlay_frame`; the SDK draws it.
egui-overlay = ["engine-render-wgpu/egui-overlay", "dep:debug-ui", "dep:egui"]

[lints]
workspace = true
