name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "Regenerate image-diff goldens on the software adapter and upload them as artifacts"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    shell: bash   # required so `!` negation works on windows-latest (default shell there is pwsh)

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Assert pinned toolchain is active
        shell: bash
        run: |
          want="$(sed -n 's/^channel *= *"\(.*\)"//p' rust-toolchain.toml)"
          test -n "$want"
          rustc --version | grep -F "$want"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Dependency direction (must pass)
        run: cargo run --locked -p xtask -- check-deps
      - name: Negative - core depends on extension (must fail)
        run: "! cargo run --locked -p xtask -- check-deps --manifest-path xtask/fixtures/core-depends-on-ext/Cargo.toml"
      - name: Negative - wgpu/winit misplaced (must fail)
        run: "! cargo run --locked -p xtask -- check-deps --manifest-path xtask/fixtures/wgpu-winit-misplaced/Cargo.toml"
      - name: Negative - egui-wgpu misplaced (must fail)
        run: "! cargo run --locked -p xtask -- check-deps --manifest-path xtask/fixtures/egui-wgpu-misplaced/Cargo.toml"
      - name: Negative - egui in core tier (must fail)
        run: "! cargo run --locked -p xtask -- check-deps --manifest-path xtask/fixtures/egui-core-misplaced/Cargo.toml"
      - name: Build basic_scene example
        run: cargo build --locked -p conventional-3d --example basic_scene
      - name: Run planetary_flight headless
        run: cargo run --locked -p planetary-app --example planetary_flight -- --headless 30
      - name: Test without planetary crates (fast canary)
        run: cargo test --workspace --exclude planetary-core --exclude planetary-terrain --exclude planetary-app --locked
      - name: Canary - no planetary crate reachable from conventional-3d (must pass)
        run: cargo run --locked -p xtask -- check-canary
      - name: Negative - transitive planetary leak fixture (must fail)
        run: "! cargo run --locked -p xtask -- check-canary --manifest-path xtask/fixtures/canary-leak/Cargo.toml"

  canary:
    name: canary (planetary crates absent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Remove all planetary crates from the workspace
        run: |
          rm -rf extensions/planetary
          sed -i '/extensions\/planetary\//d' Cargo.toml
          if grep -q planetary Cargo.toml; then echo "planetary still referenced in Cargo.toml"; exit 1; fi
          test ! -e extensions/planetary
      - name: Build workspace without planetary crates
        run: cargo build --workspace   # no --locked: Cargo.lock legitimately loses planetary-core
      - name: Test workspace without planetary crates
        run: cargo test --workspace --exclude xtask   # xtask's layer-table policy test lists planetary-core by design
      - name: Clippy conventional-3d
        run: cargo clippy -p conventional-3d --all-targets -- -D warnings
      - name: Run basic_scene headless without planetary crates
        run: cargo run -p conventional-3d --example basic_scene -- --headless 5
      - name: Canary check on the reduced workspace
        run: cargo run -p xtask -- check-canary

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny (bans, licenses, sources, advisories)
        run: cargo deny check bans licenses sources advisories
      - name: Negative - cargo-deny rejects misplaced wgpu (must fail)
        run: "! cargo deny --manifest-path xtask/fixtures/wgpu-winit-misplaced/Cargo.toml --config deny.toml check bans"

  image-diff:
    name: image-diff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wgpu_backend: vulkan   # lavapipe via mesa-vulkan-drivers
            require_adapter: "1"
            require_goldens: "1"
          - os: windows-latest
            wgpu_backend: dx12     # WARP is built in
            require_adapter: "1"
            require_goldens: "1"
          - os: macos-latest
            wgpu_backend: metal
            require_adapter: ""    # no software Metal adapter exists: skip-allowed
            require_goldens: ""    # never required on macOS (no goldens)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WGPU_BACKEND: ${{ matrix.wgpu_backend }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Assert pinned toolchain is active
        shell: bash
        run: |
          want="$(sed -n 's/^channel *= *"\(.*\)"//p' rust-toolchain.toml)"
          test -n "$want"
          rustc --version | grep -F "$want"
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (Linux software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
      # Update path: replaces the verify steps. ONLY place ARC_UPDATE_GOLDENS is set.
      - name: Update goldens (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
        env:
          ARC_UPDATE_GOLDENS: "1"
          ARC_REQUIRE_ADAPTER: ${{ matrix.require_adapter }}
        run: |
          cargo test -p engine-render-wgpu --locked --features egui-overlay --test image_diff -- --nocapture --test-threads=1
          cargo test -p planetary-app --locked --test atmosphere_ring -- --nocapture --test-threads=1
      # ARC_REQUIRE_ADAPTER is "1" on Linux and Windows only; macOS has no software Metal adapter.
      - name: Verify image diffs
        if: github.event_name != 'workflow_dispatch' || !inputs.update_goldens
        env:
          ARC_REQUIRE_ADAPTER: ${{ matrix.require_adapter }}
          ARC_REQUIRE_GOLDENS: ${{ matrix.require_goldens }}
        run: cargo test -p engine-render-wgpu --locked --test image_diff -- --nocapture --test-threads=1
      # egui-overlay feature path: also runs the overlay_corner golden and overlay_corner_differs.
      - name: Verify image diffs (egui-overlay feature)
        if: github.event_name != 'workflow_dispatch' || !inputs.update_goldens
        env:
          ARC_REQUIRE_ADAPTER: ${{ matrix.require_adapter }}
          ARC_REQUIRE_GOLDENS: ${{ matrix.require_goldens }}
        run: cargo test -p engine-render-wgpu --locked --features egui-overlay --test image_diff -- --nocapture --test-threads=1
      # atmosphere_ring lives in planetary-app (plan 08-10), same skip/require env semantics.
      - name: Verify atmosphere_ring image
        if: github.event_name != 'workflow_dispatch' || !inputs.update_goldens
        env:
          ARC_REQUIRE_ADAPTER: ${{ matrix.require_adapter }}
          ARC_REQUIRE_GOLDENS: ${{ matrix.require_goldens }}
        run: cargo test -p planetary-app --locked --test atmosphere_ring -- --nocapture --test-threads=1
      - name: Upload image-diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-diff-${{ matrix.os }}
          path: target/image-diff/
          if-no-files-found: ignore
      - name: Upload regenerated goldens
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_goldens
        uses: actions/upload-artifact@v4
        with:
          name: goldens-${{ matrix.os }}
          path: |
            crates/engine-render-wgpu/tests/golden/
            extensions/planetary/planetary-app/tests/golden/
          if-no-files-found: ignore

  feature-paths:
    name: feature paths (debug-overlay)
    runs-on: ubuntu-latest
    # Narrowed to --lib + overlay_toggle (the only debug-overlay-gated targets); the full planetary-app
    # suite in a debug build took ~27 min on hosted CI and is covered by the build job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Default builds have no egui, so these feature paths are otherwise never exercised.
      - name: Clippy debug-overlay
        run: cargo clippy -p planetary-app --features debug-overlay --all-targets --locked -- -D warnings
      - name: Test debug-overlay
        run: cargo test -p planetary-app --features debug-overlay --locked --lib --test overlay_toggle
      # SDK/backend egui-overlay paths (OverlayHost, painter) are otherwise only reached via planetary-app.
      - name: Clippy egui-overlay (engine-sdk, engine-render-wgpu)
        run: cargo clippy -p engine-sdk -p engine-render-wgpu --features engine-sdk/egui-overlay,engine-render-wgpu/egui-overlay --all-targets --locked -- -D warnings
      - name: Test egui-overlay (engine-sdk)
        run: cargo test -p engine-sdk --features egui-overlay --locked

  bench:
    name: bench (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Locked decision: CI records criterion results; it never compares baselines or fails on timing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Explicit --bench targets: `--benches` also hits libtest targets, which reject criterion flags.
      - name: Criterion benches (quick)
        run: cargo bench --workspace --bench spatial --bench select --bench mesh --bench stream --bench ecs --locked -- --noplot --quick
      - name: Upload criterion output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: target/criterion
          if-no-files-found: ignore
