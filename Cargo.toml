[workspace]
resolver = "3"
members = [
    "crates/engine-math",
    "crates/engine-diagnostics",
    "crates/engine-core",
    "crates/engine-jobs",
    "crates/engine-platform",
    "crates/engine-assets",
    "crates/engine-world",
    "crates/engine-spatial",
    "crates/engine-render",
    "crates/engine-render-wgpu",
    "crates/engine-sdk",
    "extensions/conventional-3d",
    "extensions/planetary/planetary-core",
    "xtask",
]
exclude = ["xtask/fixtures"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
engine-math = { path = "crates/engine-math" }
engine-diagnostics = { path = "crates/engine-diagnostics" }
engine-core = { path = "crates/engine-core" }
engine-jobs = { path = "crates/engine-jobs" }
engine-platform = { path = "crates/engine-platform" }
engine-assets = { path = "crates/engine-assets" }
engine-world = { path = "crates/engine-world" }
engine-spatial = { path = "crates/engine-spatial" }
engine-render = { path = "crates/engine-render" }
engine-render-wgpu = { path = "crates/engine-render-wgpu" }
engine-sdk = { path = "crates/engine-sdk" }
cargo_metadata = "0.23.1"
glam = "0.34.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
crossbeam-channel = "0.5.17"
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
thiserror = "2.0.21"
wgpu = "30.0.2"
winit = "0.30.13"
raw-window-handle = "0.6.2"
pollster = "1.0.3"
bytemuck = { version = "1.25.2", features = ["derive"] }
slotmap = "1.1.1"
uuid = { version = "1.29.3", default-features = false, features = ["v5"] }
